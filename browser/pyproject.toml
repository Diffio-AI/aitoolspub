[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-browser"
version = "0.1.0"
description = "Shared browser MCP for Claude Code: an LLM navigator plus deterministic page and form tools on one signed-in Chrome"
requires-python = ">=3.13"
dependencies = [
    "fastbrowse==0.9.0",
    "httpx>=0.28",
    "mcp==2.3.0",
    "playwright>=1.55",
    "pydantic>=2.11",
    "secretstorage>=3.5.0",
    "websockets>=14",
]

[project.scripts]
agent-browser-mcp = "browse.server:main"
agent-browser-janitor = "browse.janitor:main"
agent-browser-import-cookies = "browse.import_cookies:main"
agent-browser-type = "browse.type_text:main"
agent-browser-google-login = "browse.google_login:main"
browse-testsite = "browse_testsite.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "python-multipart>=0.0.20",
    "starlette>=0.47",
    "uvicorn>=0.35",
]

[tool.hatch.build.targets.wheel]
packages = ["src/browse", "src/browse_testsite"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
